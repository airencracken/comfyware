name: Gentoo QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Steps handle their own errors; GitHub's default bash adds -e.
defaults:
  run:
    shell: bash --noprofile --norc {0}

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check ebuild and script syntax
        run: |
          while IFS= read -r -d '' ebuild; do
            bash -n "$ebuild" || exit 1
          done < <(git ls-files -z '*.ebuild')
          shellcheck scripts/*.sh || exit 1
      - name: Check recipes and dependency bundle tooling
        run: |
          bash scripts/test-make-deps.sh || exit 1
          for test in publication manifests recipes sandbox-packaging github-funding; do
            python3 "scripts/test-$test.py" || exit 1
          done
          python3 scripts/verify-distfile.py || exit 1
      - name: Check Gentoo packaging
        uses: pkgcore/pkgcheck-action@8491e92faa1010d5c6947c114d23215e5a74684e # v1
      - name: Check service and logging installation
        run: |
          work=$(mktemp -d) || exit 1
          trap 'rm -rf "$work"' EXIT
          for app in imvault witmoot; do
            newest=
            for ebuild in www-apps/"$app"/"$app"-*.ebuild; do
              version=${ebuild##*/}
              version=${version#"$app"-}
              version=${version%.ebuild}
              [[ $version != 9999 ]] || continue
              version=${version%-r[0-9]*}
              source_dir="$work/$ebuild"
              mkdir -p "$source_dir" || exit 1
              source="${app}_${version}_source.tar.gz"
              curl -fsSL "https://github.com/airencracken/$app/releases/download/v$version/$source" \
                -o "$work/$source" || exit 1
              python3 scripts/verify-distfile.py "www-apps/$app/Manifest" "$work/$source" || exit 1
              tar -xzf "$work/$source" -C "$source_dir" --strip-components=1 || exit 1
              bash scripts/test-install.sh "$ebuild" "$source_dir" || exit 1
              newest=$source_dir
            done
            [[ -n $newest ]] || { echo "$app has no release recipe" >&2; exit 1; }
            bash scripts/test-install.sh "www-apps/$app/$app-9999.ebuild" "$newest" || exit 1
          done
